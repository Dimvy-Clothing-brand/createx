<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="url(#iconGradient)" opacity="0.1" stroke="url(#iconGradient)" stroke-width="2"/>
  
  <!-- CreateX symbol -->
  <g transform="translate(60, 60)">
    <!-- CREATE symbol (plus) -->
    <rect x="-3" y="-20" width="6" height="40" fill="url(#iconGradient)" rx="3"/>
    <rect x="-20" y="-3" width="40" height="6" fill="url(#iconGradient)" rx="3"/>
    
    <!-- X overlay for CREATE2/CREATE3 -->
    <rect x="-15" y="-2" width="30" height="4" fill="url(#iconGradient)" transform="rotate(45)" rx="2"/>
    <rect x="-15" y="-2" width="30" height="4" fill="url(#iconGradient)" transform="rotate(-45)" rx="2"/>
  </g>
  
  <!-- Factory dots -->
  <circle cx="30" cy="30" r="3" fill="url(#iconGradient)" opacity="0.7"/>
  <circle cx="90" cy="30" r="3" fill="url(#iconGradient)" opacity="0.7"/>
  <circle cx="30" cy="90" r="3" fill="url(#iconGradient)" opacity="0.7"/>
  <circle cx="90" cy="90" r="3" fill="url(#iconGradient)" opacity="0.7"/>
</svg>
